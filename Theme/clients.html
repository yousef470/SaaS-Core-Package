<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS-Core Dashboard</title>

    <link rel="stylesheet" href="assets/scss/dash.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h1 class="logo">SaaS<span>-Core</span></h1>

        <nav>
          <a class="active" href="dash.html">
            <i class="fas fa-chart-line"></i>
            <span data-en="Dashboard" data-ar="لوحة التحكم">Dashboard</span>
          </a>
         <a href="clients.html">
            <i class="fas fa-users"></i>
            <span data-en="Clients" data-ar="العملاء">Clients</span>
          </a>

          <a>
            <i class="fas fa-dollar-sign"></i>
            <span data-en="Revenue" data-ar="الأرباح">Revenue</span>
          </a>

          <a href="setting.html">
            <i class="fas fa-cog"></i>
            <span data-en="Settings" data-ar="الإعدادات">Settings</span>
          </a>

          <a href="index.html" class="home-btn">
            <i class="fas fa-house"></i>
            <span>Home</span>
          </a>
        </nav>
      </aside>

      <!-- Main -->
      <main class="main">
        <!-- Navbar -->
        <header class="navbar">
          <h2 data-en=" client management">
            client management
          </h2>
          <div class="navbar-actions">
            <!-- زرار اللغة -->
            <div class="action-item">
              <button id="langToggle" class="btn-secondary-sm">AR</button>
            </div>

            <!-- زرار الثيم -->
            <div class="action-item">
              <button id="themeToggle" class="btn-icon">
                <i class="ri-moon-line"></i>
              </button>
            </div>

            <!-- التنبيهات -->
            <div class="action-item notification-wrapper">
              <button id="notif-btn" class="btn-icon">
                <i class="ri-notification-3-line"></i>
                <span class="notification-dot"></span>
              </button>

              <div id="notif-dropdown" class="dropdown-menu">
                <div class="notif-header">Notifications</div>
                <div class="notif-empty-state">
                  <i class="ri-notification-off-line"></i>
                  <p>No new notifications</p>
                </div>
              </div>
            </div>

            <!-- البروفايل (اللي ظاهر في الصورة عندك) -->
            <div class="user-profile-sm">
              <span>Admin</span>
              <div class="avatar">AD</div>
            </div>
          </div>
        </header>

      <!-- Table -->
<div class="table">

  <h1
    data-en=" Clients"
    data-ar=" العملاء"
    class="client-logo"
  >
 Clients
  </h1>

  <!-- Actions -->
  <div class="table-actions">

    <div class="search-box">
      <i class="ri-search-line"></i>

      <input
        type="text"
        data-en-placeholder="Search clients..."
        data-ar-placeholder="ابحث عن عميل..."
        placeholder="Search clients..."
      />
    </div>

    <button id="openModal" class="btn-primary">
      <i class="ri-add-line"></i>

      <span
        data-en="Add Client"
        data-ar="إضافة عميل"
      >
        Add Client
      </span>
    </button>

  </div>

  <!-- Clients -->
  <div class="clients-grid">


    <button
    type="button"
    class="edit-revenue-btn"
    data-id="${client.id}"
>
    <i class="ri-pencil-line"></i>
</button>
  </div>



<div id="clientsSkeleton" class="clients-skeleton">

  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>

</div>
  </div>
</div>

 <div id="clientModal" class="modal">
  <div class="modal-content">

    <div class="modal-header">
      <h3
        data-en="Add Client"
        data-ar="إضافة عميل"
      >
        Add Client
      </h3>

      <button class="close-modal" id="closeModal">
        <i class="ri-close-line"></i>
      </button>
    </div>

    <div class="modal-body">

      <input
        type="text"
        id="clientName"
        data-en-placeholder="Client Name"
        data-ar-placeholder="اسم العميل"
        placeholder="Client Name"
      />

      <input
        type="email"
        id="clientEmail"
        data-en-placeholder="Client Email"
        data-ar-placeholder="بريد العميل"
        placeholder="Client Email"
      />

      <input
        type="text"
        id="clientStatus"
        data-en-placeholder="Client Status"
        data-ar-placeholder="حالة العميل"
        placeholder="Client Status"
      />

      <select id="clientType">
        <option
          value="premium"
          data-en="Premium"
          data-ar="مميز"
        >
          Premium
        </option>

        <option
          value="basic"
          data-en="Basic"
          data-ar="أساسي"
        >
          Basic
        </option>
      </select>

      <input
        type="text"
        id="clientAvatar"
        data-en-placeholder="Avatar Image URL"
        data-ar-placeholder="رابط صورة العميل"
        placeholder="Avatar Image URL"
      />

    </div>

    <div class="modal-actions">
      <button
        class="btn-primary"
        id="saveClientBtn"
      >
        <i class="ri-save-line"></i>

        <span
          data-en="Save Client"
          data-ar="حفظ العميل"
        >
          Save Client
        </span>
      </button>
    </div>

  </div>
</div>

</div>
<!-- Delete Modal -->
<div class="delete-modal" id="deleteModal">

    <div class="delete-box">

        <i class="ri-delete-bin-6-line"></i>

        <h3
            data-en="Delete Client?"
            data-ar="حذف العميل؟"
        >
            Delete Client?
        </h3>

        <p
            data-en="This action cannot be undone."
            data-ar="لا يمكن التراجع عن هذا الإجراء."
        >
            This action cannot be undone.
        </p>

        <div class="delete-actions">

            <button
                id="cancelDelete"
                data-en="Cancel"
                data-ar="إلغاء"
            >
                Cancel
            </button>

            <button
                id="confirmDelete"
                class="danger"
                data-en="Delete"
                data-ar="حذف"
            >
                Delete
            </button>

        </div>

    </div>

</div>

<div id="revenueModal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h3>Update Revenue</h3>

      <button
        type="button"
        id="closeRevenueModal"
        class="close-modal"
      >
        <i class="ri-close-line"></i>
      </button>

    </div>

    <div class="modal-body">

      <input
        type="number"
        id="revenueInput"
        placeholder="Enter Revenue"
      />

    </div>

    <div class="modal-actions">

      <button
        type="button"
        id="saveRevenueBtn"
        class="btn-primary"
      >
        Save
      </button>

    </div>

  </div>

</div>
<script src="assets/js/dash.js"></script>
<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>
  </body>
</html>
